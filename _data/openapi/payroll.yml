openapi: 3.1.0
info:
  title: Relm Payroll API
  version: "1.0.0-draft"
  summary: "Customer payroll: estimate, create, track and cancel payroll requests."
  description: |
    Requests from the Try it panel go to the **sandbox** environment only. Draft generated on
    19 Oct 2026 from kubera `origin/main` validators and routes.
  contact:
    name: Relm Support
    email: support@relm.co
servers:
  - url: https://sandbox.api.relm.co
    description: Sandbox
security:
  - bearerAuth: []
  - signature: []
tags:
  - name: Payroll
    description: Payroll requests and transfers.
paths:
  /v1/customers/payroll/estimate:
    post:
      tags: [Payroll]
      operationId: estimatePayrollFee
      summary: Estimate payroll fee
      description: |
        Calculates fees and the amount each beneficiary receives, and returns a `feeHash` to pass
        to **Create payroll request**. `amountSplitDetails` must be non-empty with unique
        `beneficiaryId`s. `amount` is a decimal string (max 8 dp for SOURCE, 2 for PAYROLL).
      x-try-it-save:
        - { from: data.feeHash, to: payrollFeeHash }
        - { from: data.sourceAccountCurrencyId, to: sourceAccountCurrencyId }
        - { from: data.payrollAccountCurrencyId, to: payrollAccountCurrencyId }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayrollEstimateRequest" }
            example:
              sourceAccountCurrencyId: "{{sourceAccountCurrencyId}}"
              payrollAccountCurrencyId: "{{payrollAccountCurrencyId}}"
              amountSplitDetails:
                - beneficiaryId: "{{beneficiaryId}}"
                  amount: "100.00"
                  amountCurrencyType: SOURCE
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/customers/payroll/requests:
    post:
      tags: [Payroll]
      operationId: createPayrollRequest
      summary: Create payroll request
      description: |
        Creates a payroll request from a `feeHash` returned by **Estimate payroll fee**. Funds are
        debited from the source account and the request waits for a quote. Each split needs a
        `purpose`: `FCISS`, `PEN` or `OFS`.
      x-try-it-note: This debits the sandbox source account.
      x-try-it-save:
        - { from: data.id, to: requestId }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayrollCreateRequest" }
            example:
              sourceAccountCurrencyId: "{{sourceAccountCurrencyId}}"
              payrollAccountCurrencyId: "{{payrollAccountCurrencyId}}"
              feeHash: "{{payrollFeeHash}}"
              amountSplitDetails:
                - beneficiaryId: "{{beneficiaryId}}"
                  amount: "100.00"
                  amountCurrencyType: SOURCE
                  purpose: FCISS
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Payroll]
      operationId: listPayrollRequests
      summary: List payroll requests
      description: Lists payroll requests, newest first by default.
      x-try-it-save:
        - { from: data.0.id, to: requestId }
      parameters:
        - name: status
          in: query
          description: "One status or several separated by commas: RESOLVING_BENEFICIARIES, PENDING, QUOTE_PROVIDED, QUOTE_ACCEPTED, EXECUTING, PAYOUT_INITIATED, COMPLETED, PARTIALLY_COMPLETED, FAILED, CANCELLED."
          schema: { type: string, examples: ["QUOTE_PROVIDED,QUOTE_ACCEPTED"] }
        - { $ref: "#/components/parameters/StartDate" }
        - { $ref: "#/components/parameters/EndDate" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Paged" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/customers/payroll/requests/{requestId}:
    get:
      tags: [Payroll]
      operationId: getPayrollRequest
      summary: Get payroll request
      description: Returns one payroll request with its splits, transfers and fee breakdown.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Payroll]
      operationId: cancelPayrollRequest
      summary: Cancel payroll request
      description: Cancels a payroll request that hasn't been executed yet. `cancellationReason` is optional (max 500 characters).
      x-try-it-note: This cancels the request on sandbox.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cancellationReason: { type: string, maxLength: 500 }
            example:
              cancellationReason: Created by mistake
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/customers/payroll/requests/{requestId}/accept:
    patch:
      tags: [Payroll]
      operationId: acceptPayrollQuote
      summary: Accept payroll quote
      description: Accepts the quote on a request in `QUOTE_PROVIDED`, which starts execution.
      x-try-it-note: This starts the payroll on sandbox.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/customers/payroll/transfers:
    get:
      tags: [Payroll]
      operationId: listPayrollTransfers
      summary: List payroll transfers
      description: Lists individual beneficiary transfers across payroll requests.
      parameters:
        - name: search
          in: query
          description: Transfer ID or beneficiary name (partial match).
          schema: { type: string }
        - name: status
          in: query
          description: "One status or several separated by commas: PENDING, INITIATED, PROCESSING, COMPLETED, FAILED."
          schema: { type: string, examples: ["PROCESSING,COMPLETED"] }
        - { $ref: "#/components/parameters/StartDate" }
        - { $ref: "#/components/parameters/EndDate" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Paged" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-label: Bearer token
      x-help: Sandbox token from GET /v1/api-keys/tokens, called from your backend.
      description: Sandbox access token from `GET /v1/api-keys/tokens`.
    signature:
      type: apiKey
      in: header
      name: Authorization
      description: |
        `Signature <keyId>:<signature>:<timestamp>`, signed on your server (see Authentication).
        Can't be used from the Try it panel.
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StartDate:
      name: startDate
      in: query
      description: ISO 8601 date or date-time.
      schema: { type: string, examples: ["2026-10-01"] }
    EndDate:
      name: endDate
      in: query
      description: ISO 8601 date or date-time.
      schema: { type: string, examples: ["2026-10-19"] }
    Sort:
      name: sort
      in: query
      description: Sort by creation time.
      schema: { type: string, enum: [asc, desc] }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Envelope:
      description: Success. The resource is in `data`.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, const: true }
              data: {}
    Paged:
      description: Success. Items are in `data` and paging in `pagination` (no hasNextPage; keep going while page < totalPages).
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, const: true }
              data: { type: array, items: {} }
              pagination:
                type: object
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
    BadRequest:
      description: Validation failed. `error.msg` lists each problem as `<field> <message>`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The caller's role, product activation or ownership doesn't allow this request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: The resource doesn't exist or doesn't belong to the caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          properties:
            code: { type: string, examples: [bad-request] }
            fullCode: { type: string, examples: [RELM-GEN-BAD-REQUEST] }
            msg: { type: array, items: { type: string } }
            data: {}
            source: { type: string }
            statusCode: { type: integer }
            traceId: { type: string }
    PayrollSplit:
      type: object
      required: [beneficiaryId, amount]
      properties:
        beneficiaryId: { type: string, format: uuid }
        amount: { type: string, description: Decimal string greater than 0. }
        amountCurrencyType: { type: string, enum: [SOURCE, PAYROLL], default: SOURCE }
    PayrollEstimateRequest:
      type: object
      required: [sourceAccountCurrencyId, payrollAccountCurrencyId, amountSplitDetails]
      properties:
        sourceAccountCurrencyId: { type: string, format: uuid }
        payrollAccountCurrencyId: { type: string, format: uuid }
        amountSplitDetails:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PayrollSplit" }
    PayrollCreateRequest:
      type: object
      required: [sourceAccountCurrencyId, payrollAccountCurrencyId, feeHash, amountSplitDetails]
      properties:
        sourceAccountCurrencyId: { type: string, format: uuid }
        payrollAccountCurrencyId: { type: string, format: uuid }
        feeHash: { type: string }
        amountSplitDetails:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/PayrollSplit"
              - type: object
                required: [purpose]
                properties:
                  purpose: { type: string, enum: [FCISS, PEN, OFS] }
