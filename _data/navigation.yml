# The sidebar, breadcrumbs and Previous / Next links are all built from this file
# (by _plugins/docs_navigation.rb). The `parent` / `nav_order` front matter on pages is not used for them.
#
#   - title: Section name              # a top-level entry in the sidebar
#     url: /section                    # optional: the section's own page (clicking the name opens it)
#     index: true                      # optional: list the section's pages at the bottom of its page
#     also: [/old/url]                 # optional: other pages that show this section's list
#     pages: [/a, /b]                  # pages directly in the section, in order
#     groups:                          # or pages under small headings
#       - title: Heading
#         url: /old/heading/page       # optional: a page that lists the group (not linked in the sidebar)
#         pages:
#           - /page                    # title and HTTP method come from the page itself
#           - { url: /page, title: Shorter title }
#
# Every URL must be the permalink of a page; the build stops if one isn't. Pages left out of this
# file are still published but don't appear in the sidebar (the build lists them as a warning).

- title: Get Started
  url: /

- title: API Authentication
  url: /auth
  groups:
    - title: Setup
      pages:
        - /auth/getting-started
        - /auth/create-api-key
        - /auth/auth-format
        - /auth/signing-process
    - title: Examples
      url: /auth/implementation-examples
      pages:
        - /auth/implementation-examples/javascript
        - /auth/implementation-examples/python
        - /auth/implementation-examples/postman
    - title: Reference
      pages:
        - /auth/security-best-practices
        - /auth/troubleshooting
        - /auth/technical-details

- title: SDK Integration
  url: /sdk-integration
  pages:
    - /onboarding-sdk
    - /sumsub-sdk

