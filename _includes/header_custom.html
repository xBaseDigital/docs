{% assign ai_endpoint = site.ai_assist.endpoint | default: "" | strip %}
<div class="header-actions">
  {% if ai_endpoint != "" %}
  <button type="button" class="ask-ai-trigger" data-ask-ai-trigger aria-controls="ask-ai-panel" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" class="ask-ai-icon"><path fill="currentColor" d="M12 2.5l1.9 5.1a4 4 0 0 0 2.5 2.5l5.1 1.9-5.1 1.9a4 4 0 0 0-2.5 2.5L12 21.5l-1.9-5.1a4 4 0 0 0-2.5-2.5L2.5 12l5.1-1.9a4 4 0 0 0 2.5-2.5z"/></svg>
    <span>Ask AI</span>
    <kbd></kbd>
  </button>
  {% endif %}
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch colour mode" title="Switch colour mode">
    <svg class="theme-toggle-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="theme-toggle-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
  </button>
</div>
