<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
{%- assign theme_default = site.theme_toggle.default | default: "system" -%}
<script>
  /*
   * Light / dark mode: the header toggle and following the system setting. The first choice is made in
   * head.html, before the page is drawn, so it never flashes unstyled or in the wrong colours.
   * A choice made with the header toggle is remembered; until then the site follows the system setting
   * (or `theme_toggle.default` in _config.yml). Each mode is one of the theme's colour schemes.
   */
  (function () {
    var KEY = 'relm.theme';
    var fallback = '{{ theme_default }}';
    var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
    var css = '{{ "/assets/css/just-the-docs-" | relative_url }}';

    function saved() {
      try { var v = localStorage.getItem(KEY); return v === 'light' || v === 'dark' ? v : null; } catch (e) { return null; }
    }
    function preferred() {
      if (fallback === 'light' || fallback === 'dark') { return fallback; }
      return media && media.matches ? 'light' : 'dark';
    }
    /* head.html already loaded the right stylesheet. When the mode changes, load the other one alongside
       and drop the old one once it's ready, so the page is never without styles. */
    function swapStylesheet(theme) {
      var link = document.getElementById('relm-theme-css');
      var href = css + theme + '.css';
      if (!link || link.getAttribute('href') === href) { return; }
      var next = link.cloneNode();
      next.setAttribute('href', href);
      next.onload = function () { if (link.parentNode) { link.parentNode.removeChild(link); } };
      next.onerror = next.onload;
      link.id = '';
      next.id = 'relm-theme-css';
      link.parentNode.insertBefore(next, link.nextSibling);
    }
    function apply(theme) {
      swapStylesheet(theme);
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
      var toggle = document.querySelector('[data-theme-toggle]');
      if (toggle) {
        var next = theme === 'dark' ? 'light' : 'dark';
        toggle.setAttribute('aria-label', 'Switch to ' + next + ' mode');
        toggle.setAttribute('title', 'Switch to ' + next + ' mode');
      }
    }

    window.relmTheme = {
      get: function () { return document.documentElement.getAttribute('data-theme') || preferred(); },
      set: function (theme) {
        try { localStorage.setItem(KEY, theme); } catch (e) { /* remembered for this page only */ }
        apply(theme);
      },
      toggle: function () { this.set(this.get() === 'dark' ? 'light' : 'dark'); }
    };

    apply(saved() || preferred());

    /* Follow the system setting live, until a choice has been made. */
    if (media && media.addEventListener) {
      media.addEventListener('change', function () { if (!saved()) { apply(preferred()); } });
    }
    document.addEventListener('DOMContentLoaded', function () {
      apply(window.relmTheme.get());
      var toggle = document.querySelector('[data-theme-toggle]');
      if (toggle) { toggle.addEventListener('click', function () { window.relmTheme.toggle(); }); }

      /* Mark the current page in the sidebar so it can be styled and announced.
         The theme removes that link's href on load, so look for it either way. */
      var current = document.querySelector('#site-nav a.nav-list-link:not([href])');
      if (!current) {
        var here = location.pathname.replace(/\.html$/, '').replace(/\/$/, '') || '/';
        var links = document.querySelectorAll('#site-nav a.nav-list-link[href]');
        for (var i = 0; i < links.length; i++) {
          if ((links[i].pathname.replace(/\.html$/, '').replace(/\/$/, '') || '/') === here) { current = links[i]; break; }
        }
      }
      if (current) { current.setAttribute('aria-current', 'page'); }
    });
  })();
</script>
{% if page.try_it %}
<script src="{{ '/assets/js/try-it.js' | relative_url }}" defer></script>
{% endif %}
{% assign ai_endpoint = site.ai_assist.endpoint | default: "" | strip %}
{% if ai_endpoint != "" %}
<script src="{{ '/assets/js/ask-ai.js' | relative_url }}" defer
        data-endpoint="{{ ai_endpoint }}"
        data-baseurl="{{ site.baseurl }}"></script>
{% endif %}
