title: Relm Developer Portal
description: Developer documentation portal
theme: just-the-docs

url: https://xbasedigital.github.io/docs
logo: "/assets/relm.png"

# aux_links:
#   Template Repository: https://github.com/just-the-docs/just-the-docs-template

heading_anchors: true
color_scheme: dark

footer_content: "Copyright &copy; 2025 Relm"

callouts:
  endpoint-desc:
    title: About this endpoint
    color: blue

# Ask AI: answers questions from these docs (service in ai-assist/, index built by _plugins/ai_docs_index.rb).
# Set `endpoint` to the deployed service URL to turn it on; leave it empty to hide Ask AI.
ai_assist:
  endpoint: ""

# Sass: the just-the-docs theme (still in 0.12) is built on @import, map-get() and darken(), which Dart Sass
# flags as deprecated on every build. That's the theme's code, so keep it out of the build log.
# Remove these lines once the theme moves to @use / sass:map / sass:color.
sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

exclude:
  - ai-assist

# Light / dark mode toggle in the header. Visitors' choice is remembered;
# `default` applies until they pick one: system (follow the device), light or dark.
theme_toggle:
  default: system
